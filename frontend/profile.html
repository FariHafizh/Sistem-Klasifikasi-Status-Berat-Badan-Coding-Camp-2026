<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Isi Data / Update Progres</title>
    <link rel="stylesheet" href="/app/styles.css" />
  </head>
  <body>
    <header>
      <strong>Isi Data / Update Progres</strong>
      <nav></nav>
    </header>
    <main>
      <div class="card">
        <p class="small">Halaman ini akan memanggil endpoint <code>/predict</code>. Isian wajib lengkap.</p>
      </div>

      <form id="predictForm" class="card">
        <div class="row">
          <div>
            <label>Umur</label>
            <input id="age" type="number" min="1" required />
          </div>
          <div>
            <label>Jenis Kelamin</label>
            <select id="gender_num" required>
              <option value="">Pilih</option>
              <option value="1">Laki-laki</option>
              <option value="0">Perempuan</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div>
            <label>Tinggi (cm)</label>
            <input id="height" type="number" step="0.1" min="1" required />
          </div>
          <div>
            <label>Berat (kg)</label>
            <input id="weight" type="number" step="0.1" min="1" required />
          </div>
        </div>

        <div class="row">
          <div>
            <label>CH2O (gelas/hari)</label>
            <input id="ch2o" type="number" step="0.1" min="0" required />
          </div>
          <div>
            <label>FAF (aktivitas/minggu)</label>
            <input id="faf" type="number" step="0.1" min="0" required />
          </div>
        </div>

        <div class="row">
          <div>
            <label>FAVC (makan tinggi kalori?)</label>
            <select id="favc_num" required>
              <option value="">Pilih</option>
              <option value="1">Ya</option>
              <option value="0">Tidak</option>
            </select>
          </div>
          <div>
            <label>SCC (monitoring kalori?)</label>
            <select id="scc_num" required>
              <option value="">Pilih</option>
              <option value="1">Ya</option>
              <option value="0">Tidak</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div>
            <label>Family history overweight?</label>
            <select id="family_history_num" required>
              <option value="">Pilih</option>
              <option value="1">Ya</option>
              <option value="0">Tidak</option>
            </select>
          </div>
          <div>
            <label>CAEC (ngemil di antara waktu makan?)</label>
            <select id="caec_num" required>
              <option value="">Pilih</option>
              <option value="1">Ya</option>
              <option value="0">Tidak</option>
            </select>
          </div>
        </div>

        <button type="submit">Kirim & Prediksi</button>
        <p id="msg" class="small"></p>
      </form>

      <div id="result" class="card" style="display:none"></div>
    </main>

    <script src="/app/app.js"></script>
    <script>
      renderNav('profile');
      requireAuth();

      const form = document.getElementById('predictForm');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const payload = {
          age: Number(document.getElementById('age').value),
          gender_num: Number(document.getElementById('gender_num').value),
          height: Number(document.getElementById('height').value),
          weight: Number(document.getElementById('weight').value),
          ch2o: Number(document.getElementById('ch2o').value),
          favc_num: Number(document.getElementById('favc_num').value),
          faf: Number(document.getElementById('faf').value),
          scc_num: Number(document.getElementById('scc_num').value),
          family_history_num: Number(document.getElementById('family_history_num').value),
          caec_num: Number(document.getElementById('caec_num').value),
        };

        const { res, body } = await apiFetch('/predict', {
          method: 'POST',
          body: JSON.stringify(payload),
        });

        const msg = document.getElementById('msg');
        const result = document.getElementById('result');

        if (!res.ok) {
          msg.className = 'small error';
          msg.textContent = body?.message || 'Gagal prediksi.';
          result.style.display = 'none';
          return;
        }

        msg.className = 'small success';
        msg.textContent = 'Prediksi berhasil. Mengarahkan ke Dashboard...';

        result.style.display = 'block';
        const hp = body.hasil_prediksi || {};
        result.innerHTML = `
          <strong>Hasil Prediksi</strong>
          <div>Status: <b>${hp.status_kesehatan}</b></div>
          <div>BMI: ${hp.bmi}</div>
          <div>Model: ${hp.model_used}</div>
        `;

        setTimeout(() => (window.location.href = '/app/dashboard'), 900);
      });
    </script>
  </body>
</html>
