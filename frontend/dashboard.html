<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="/app/styles.css" />
  </head>
  <body>
    <header>
      <strong>Dashboard</strong>
      <nav></nav>
    </header>
    <main>
      <div id="card" class="card"></div>
    </main>

    <script src="/app/app.js"></script>
    <script>
      renderNav('dashboard');
      if (!requireAuth()) {
        // redirected
      }

      async function load() {
        const { res, body } = await apiFetch('/dashboard', { method: 'GET' });
        const card = document.getElementById('card');

        if (!res.ok) {
          card.innerHTML = `<div class="error">${body?.message || 'Gagal load dashboard.'}</div>`;
          return;
        }

        if (!body.has_data) {
          card.innerHTML = `
            <p>${body.message}</p>
            <a href="/app/profile">Isi data diri sekarang</a>
          `;
          return;
        }

        const d = body.data_terbaru;
        card.innerHTML = `
          <p>${body.message}</p>
          <div><b>Status:</b> ${d.status_kesehatan}</div>
          <div><b>Berat:</b> ${d.weight} kg</div>
          <div><b>Tes terakhir:</b> ${d.tanggal_tes_terakhir}</div>
          <hr />
          <a href="/app/profile">Update progres</a>
        `;
      }

      load();
    </script>
  </body>
</html>
