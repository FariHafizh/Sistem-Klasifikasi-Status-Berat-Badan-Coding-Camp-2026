<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register</title>
    <link rel="stylesheet" href="/app/styles.css" />
  </head>
  <body>
    <header>
      <strong>Register</strong>
      <nav></nav>
    </header>
    <main>
      <form id="registerForm" class="card">
        <label>Username</label>
        <input id="username" required />

        <label>Email</label>
        <input id="email" type="email" required />

        <label>Password</label>
        <input id="password" type="password" required />

        <button type="submit">Register</button>
        <p id="msg" class="small"></p>
      </form>
    </main>

    <script src="/app/app.js"></script>
    <script>
      renderNav('register');

      const form = document.getElementById('registerForm');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const { res, body } = await apiFetch('/register', {
          method: 'POST',
          body: JSON.stringify({
            username: document.getElementById('username').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });

        const msg = document.getElementById('msg');
        if (!res.ok) {
          msg.className = 'small error';
          msg.textContent = body?.message || 'Register gagal.';
          return;
        }

        msg.className = 'small success';
        msg.textContent = 'Register berhasil. Silakan login.';
        setTimeout(() => (window.location.href = '/app/login'), 600);
      });
    </script>
  </body>
</html>
