<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rekomendasi</title>
    <link rel="stylesheet" href="/app/styles.css" />
  </head>
  <body>
    <header>
      <strong>Rekomendasi</strong>
      <nav></nav>
    </header>
    <main>
      <div id="wrap" class="card"></div>
    </main>

    <script src="/app/app.js"></script>
    <script>
      renderNav('recommendation');
      if (!requireAuth()) {
        // redirected
      }

      function escapeHtml(s) {
        return String(s)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;');
      }

      async function load() {
        const { res, body } = await apiFetch('/recommendation', { method: 'GET' });
        const wrap = document.getElementById('wrap');

        if (res.status === 503) {
          wrap.innerHTML = `<p class="error">${body?.message || 'GENAI_API_KEY belum diset.'}</p>`;
          return;
        }

        if (res.status === 404) {
          wrap.innerHTML = `<p class="error">${body?.message || 'Belum ada data prediksi.'}</p><a href="/app/profile">Isi data dulu</a>`;
          return;
        }

        if (!res.ok) {
          wrap.innerHTML = `<div class="error">${body?.message || 'Gagal ambil rekomendasi.'}</div>`;
          return;
        }

        const text = body.rekomendasi || '';
        wrap.innerHTML = `
          <p class="small">Rekomendasi dari GenAI (ringkas).</p>
          <pre style="white-space: pre-wrap;">${escapeHtml(text)}</pre>
        `;
      }

      load();
    </script>
  </body>
</html>
